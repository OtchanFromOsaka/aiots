version: "3"
name: "aiots"
volumes:
  dummy:
services:
  aiots:
    container_name: aiots
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 3000:3000
      - 3001:3001
      - 4000:4000
      - 4001:4001
      - 5000:5000
      - 5001:5001
      - 9323:9323
    volumes:
      - ../:/home/aiots/dev
      - ./bin/aiots-root:/sbin/aiots-root
      - ./bin/aiots:/usr/local/bin/aiots
      - dummy:/home/aiots/dev/.pnpm-store
      - dummy:/home/aiots/dev/node_modules
    tty: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
