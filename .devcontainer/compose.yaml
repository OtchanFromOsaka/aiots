version: "3"
name: "aiots"
volumes:
  dummy:
services:
  app:
    container_name: aiots-app
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 5173:5173
      - 8787:8787
      - 9323:9323
    volumes:
      - ../:/home/aiots/dev
      - ./bin/root:/sbin/root
      - ./bin/aiots:/usr/local/bin/aiots
      - dummy:/home/aiots/dev/.pnpm-store
      - dummy:/home/aiots/dev/node_modules
    tty: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
